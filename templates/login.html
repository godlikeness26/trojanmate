{% extends "base.html" %}
{% block title %}Login | TrojanMate{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to TrojanMate.</p>

  <form method="post">
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required></label>
    <div class="auth-actions">
      <button class="btn" type="submit">Log In</button>
    </div>
  </form>

  <p class="auth-inline-link"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
  <p>New to TrojanMate? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
