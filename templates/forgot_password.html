{% extends "base.html" %}
{% block title %}Forgot Password | TrojanMate{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Reset your password</h1>
  <p class="muted">Enter the email address associated with your account.</p>

  <form method="post">
    <label>Email
      <input type="email" name="email" placeholder="you@example.com" required>
    </label>
    <button class="btn" type="submit">Send Reset Link</button>
  </form>

  <p><a href="{{ url_for('login') }}">Back to login</a></p>
</div>
{% endblock %}
